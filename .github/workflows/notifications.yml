# Runs the notification service on GitHub's machines instead of a laptop.
name: Notifications

# Every half hour, and on demand from the Actions tab.
#
# WHY HALF AN HOUR. A private repository gets 2,000 free Actions minutes a
# month and every run is billed as at least one whole minute, however briefly it
# actually runs. Half-hourly is 1,440 a month, which fits with room to spare;
# quarter-hourly is 2,880, which does not. Nothing here has ever cost anything
# and this keeps it that way.
#
# GitHub's scheduler is best effort. A run can arrive several minutes late,
# especially on the hour when everybody else's jobs are queued, and the delay is
# not something a workflow can shorten. If the laptop service is also running it
# takes over the moment it is awake — see the claim in sendOne for why the two
# never send the same thing twice.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# One at a time. Two overlapping runs would each claim work the other was
# already doing, and the second adds nothing but contention.
concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Generous compared with the few seconds this takes, and small enough that a
    # hung network call cannot quietly eat the monthly budget.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Three packages, not the whole project. `npm ci` here would install Expo,
      # React Native and the rest of a mobile toolchain to send an email, and
      # would turn a twenty second job into a three minute one.
      - name: Install what the service needs
        run: npm install --no-save --no-audit --no-fund firebase-admin web-push nodemailer

      # Named, not guessed. Without this the script exits on the first thing it
      # cannot find and the log says "VAPID_PRIVATE_KEY is not set", which is
      # true and unhelpful when the real answer is that three of five secrets
      # were never added. This checks all of them and lists what is missing.
      - name: Check the secrets are present
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PASSWORD_PRIVATE_KEY: ${{ secrets.PASSWORD_PRIVATE_KEY }}
          # The same names read from the OTHER tab of that settings page.
          #
          # "Secrets and variables" is one page with two tabs, and a value typed
          # into Variables is invisible to `secrets.*` — the job then behaves
          # exactly as though nothing was ever added. Only whether each name is
          # PRESENT is read here; the values are never printed, and a private
          # key does not belong in Variables in any case, because that tab shows
          # its contents in plain text to anyone who can open the page.
          VAR_FIREBASE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          VAR_VAPID_PRIVATE_KEY: ${{ vars.VAPID_PRIVATE_KEY }}
          VAR_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAR_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          missing=""
          for name in FIREBASE_SERVICE_ACCOUNT VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing  - $name
"; fi
          done

          # Optional. Absent, admin-set passwords are simply not applied.
          if [ -z "$PASSWORD_PRIVATE_KEY" ]; then
            echo "note: PASSWORD_PRIVATE_KEY is not set - admin-set passwords will be skipped"
          fi

          # Found in the wrong tab, which looks identical to not being added.
          wrong=""
          for name in FIREBASE_SERVICE_ACCOUNT VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT; do
            eval "here=\${$name}"
            eval "there=\${VAR_$name}"
            if [ -z "$here" ] && [ -n "$there" ]; then wrong="$wrong  - $name
"; fi
          done

          if [ -n "$wrong" ]; then
            {
              echo "## These are in the wrong tab"
              echo ""
              printf "$wrong"
              echo ""
              echo "They were added under **Variables**. They must be under **Secrets**."
              echo "Delete them from the Variables tab and add them again as"
              echo "*New repository secret* on the Secrets tab."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Added under Variables instead of Secrets:"
            printf "$wrong"
          fi

          if [ -n "$missing" ]; then
            # Written to the run's summary as well as the log. The log needs
            # three clicks to reach and the summary is the first thing on the
            # page, which matters when the reader is not a developer.
            {
              echo "## Secrets missing"
              echo ""
              printf "$missing"
              echo ""
              echo "Add them under **Settings > Secrets and variables > Actions**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "These repository secrets are missing:"
            printf "$missing"
            echo ""
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # A service account key is JSON. Catching a truncated or half-pasted
          # one here beats a stack trace from inside firebase-admin.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/key-check.json
          if ! node -e "const k=require('/tmp/key-check.json'); if(!k.private_key||!k.client_email) throw new Error('missing private_key or client_email')"; then
            {
              echo "## FIREBASE_SERVICE_ACCOUNT is not a complete key"
              echo ""
              echo "Paste the WHOLE of serviceAccount.json, from the opening { to the closing }."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FIREBASE_SERVICE_ACCOUNT is not a complete service account key."
            echo "Paste the WHOLE of serviceAccount.json, from the opening { to the closing }."
            exit 1
          fi
          rm -f /tmp/key-check.json
          echo "All required secrets are present."

      # Written to the workspace and never committed: the file is in
      # .gitignore, and the workspace is destroyed when the job ends.
      - name: Write the service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json

      - name: Deliver
        env:
          # Push
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Admin-set passwords
          PASSWORD_PRIVATE_KEY: ${{ secrets.PASSWORD_PRIVATE_KEY }}
          # Booking confirmation email. Absent, the service skips email and
          # everything else still runs.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # pipefail, or the pipe into tee reports tee's success and a failed
          # delivery is recorded as a green run. The default shell here is
          # `bash -e`, which does not include it.
          set -o pipefail
          status=0
          node scripts/send-push.js 2>&1 | tee /tmp/deliver.log || status=$?
          {
            echo "## Delivery run"
            echo ""
            echo '```'
            tail -25 /tmp/deliver.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Whatever happened, the key does not outlive the job. Belt and braces:
      # the runner is thrown away anyway.
      - name: Remove the key
        if: always()
        run: rm -f serviceAccount.json
