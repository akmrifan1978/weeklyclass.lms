# Runs the notification service on GitHub's machines instead of a laptop.
name: Notifications

# Every five minutes, and on demand from the Actions tab.
#
# WHY FIVE AND NOT THIRTY. This repository is public, and public repositories
# get unlimited Actions minutes. The half-hourly schedule was chosen to fit the
# 2,000 free minutes a PRIVATE repository gets, which does not apply here.
#
# If this repository is ever made private, change the cron back to '*/30 * * * *'
# or it will run past the free allowance: at five-minute intervals every run is
# billed as a whole minute, which is 8,640 minutes a month against 2,000 free.
#
# GitHub's scheduler is best effort. A run can arrive a few minutes late,
# especially on the hour when everybody else's jobs are queued.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# One at a time. Two overlapping runs would each claim work the other was
# already doing, and the second adds nothing but contention.
concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Generous next to the few seconds this takes, and short enough that a hung
    # network call cannot sit there for an hour.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Three packages, not the whole project. `npm ci` here would install Expo,
      # React Native and the rest of a mobile toolchain to send an email, and
      # would turn a twenty second job into a three minute one.
      - name: Install what the service needs
        run: npm install --no-save --no-audit --no-fund firebase-admin web-push nodemailer google-auth-library

      # Named, not guessed. Without this the script stops at the first thing it
      # cannot find and reports only that, which is unhelpful when the real
      # answer is that three of five secrets were never added.
      #
      # Every string here is written with printf and no embedded line breaks.
      # An earlier version built a list by appending "\n" inside a shell
      # variable; the continuation line began at column 0, which ENDS a YAML
      # block scalar. The whole workflow became invalid and GitHub refused
      # every run for a day — reporting it by file path rather than by name,
      # which is the tell.
      - name: Check the secrets are present
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PASSWORD_PRIVATE_KEY: ${{ secrets.PASSWORD_PRIVATE_KEY }}
          VAR_FIREBASE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          VAR_VAPID_PRIVATE_KEY: ${{ vars.VAPID_PRIVATE_KEY }}
          VAR_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAR_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          missing=0
          wrong=0
          for name in FIREBASE_SERVICE_ACCOUNT VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT; do
            eval "here=\${$name}"
            eval "there=\${VAR_$name}"
            if [ -z "$here" ]; then
              missing=$((missing + 1))
              printf '  MISSING: %s\n' "$name"
              printf '  MISSING: `%s`\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$there" ]; then
                wrong=$((wrong + 1))
                printf '    ^ this one is in the Variables tab. It must be in Secrets.\n'
                printf '    (found under **Variables** - it must be under **Secrets**)\n' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          if [ -z "$PASSWORD_PRIVATE_KEY" ]; then
            printf 'note: PASSWORD_PRIVATE_KEY is not set - admin-set passwords will be skipped\n'
          fi

          if [ "$missing" -gt 0 ]; then
            printf 'Add them under Settings > Secrets and variables > Actions.\n'
            exit 1
          fi

          # A service account key is JSON. Catching a truncated or half-pasted
          # one here beats a stack trace from inside firebase-admin.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/key-check.json
          if ! node -e "const k=require('/tmp/key-check.json'); if(!k.private_key||!k.client_email) throw new Error('incomplete')"; then
            printf 'FIREBASE_SERVICE_ACCOUNT is not a complete service account key.\n'
            printf 'Paste the WHOLE of serviceAccount.json, from the opening brace to the closing one.\n'
            exit 1
          fi
          rm -f /tmp/key-check.json
          printf 'All required secrets are present.\n'

      # Written to the workspace and never committed: the file is in
      # .gitignore, and the workspace is destroyed when the job ends.
      - name: Write the service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json

      - name: Deliver
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PASSWORD_PRIVATE_KEY: ${{ secrets.PASSWORD_PRIVATE_KEY }}
          # Booking confirmation email. Absent, the service skips email and
          # everything else still runs.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # New-registration alerts go to every active admin's own address,
          # plus these if set (comma-separated).
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          # Optional free WhatsApp alert to the admin's own phone through
          # CallMeBot. Both must be set, or WhatsApp is simply skipped.
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          # pipefail, or the pipe into tee reports tee's success and a failed
          # delivery is recorded as a green run. The default shell here is
          # `bash -e`, which does not include it.
          set -o pipefail
          status=0
          node scripts/send-push.js 2>&1 | tee /tmp/deliver.log || status=$?
          printf '## Delivery run\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/deliver.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The installed app's icon comes from the web manifest, which only a new
      # release can change. When the logo, its shape or the app name has changed
      # since last time, this releases a copy of the live site with only the
      # manifest replaced. It never fails the job: a stale icon is not worth a
      # red run, and it must not stand in the way of notifications.
      - name: Keep the installed app icon in step with the logo
        if: always()
        run: node scripts/sync-branding.js

      # Whatever happened, the key does not outlive the job. Belt and braces:
      # the runner is thrown away anyway.
      - name: Remove the key
        if: always()
        run: rm -f serviceAccount.json
